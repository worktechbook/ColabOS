[app]
name = "devtools"
version = "1.0.0"
type = "tool"
schema_version = "1"
description = "Curated dev stack: Node v24.19.0, npm 11, Bun 1.3, Go 1.22, Rust 1.97, uv, rg, fd, jq, fzf, tree, gh"

[artifact]
# Filename 16-hex suffix is the deterministic content-tree hash; sha256 is the compressed .tar.zst digest.
file = "devtools-1.0.0-a92aed243b76f7dc.tar.zst"
sha256 = "a4ba1e7448e70f61459780e01c6044bc228b6dd1583e768a13410945008a0e8b"
bins = ["node", "npm", "npx", "pnpm", "yarn", "bun", "bunx", "go", "gofmt", "rustc", "cargo", "rustup", "uv", "uvx", "rg", "fd", "jq", "fzf", "tree", "gh"]

[persist]
# NOTE: Consider keeping cargo/npm caches local and persisting only compact configs;
# prefer GH_TOKEN via Colab Secrets instead of storing gh hosts.yml on Drive.
"home/devtools/cargo" = "/root/.cargo"
"home/devtools/npm" = "/root/.npm"
"home/devtools/gh" = "/root/.config/gh"

[env]
GOROOT = "/opt/colabos/devtools/lib_go"
GOPATH = "/root/go"
CARGO_HOME = "/root/.cargo"
RUSTUP_HOME = "/content/drive/MyDrive/ColabOS/home/devtools/rustup"

[health]
command = "node --version >/dev/null 2>&1 && npm --version >/dev/null 2>&1 && npx --version >/dev/null 2>&1 && pnpm --version >/dev/null 2>&1 && yarn --version >/dev/null 2>&1 && bun --version >/dev/null 2>&1 && bunx --version >/dev/null 2>&1 && go version >/dev/null 2>&1 && printf '' | gofmt >/dev/null 2>&1 && rustc --version >/dev/null 2>&1 && cargo --version >/dev/null 2>&1 && rustup --version >/dev/null 2>&1 && uv --version >/dev/null 2>&1 && uvx --version >/dev/null 2>&1 && rg --version >/dev/null 2>&1 && fd --version >/dev/null 2>&1 && jq --version >/dev/null 2>&1 && fzf --version >/dev/null 2>&1 && tree --version >/dev/null 2>&1 && gh --version >/dev/null 2>&1"
